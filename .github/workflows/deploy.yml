name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test
      - name: Build
        env:
          # Serve from /<repo>/ on github.io project sites. Override this
          # repository variable if using a custom domain or user/org site ('/').
          VITE_BASE: ${{ vars.VITE_BASE || '/three-musketeers/' }}
          # Public URL of the deployed Cloudflare Worker, e.g.
          # https://three-musketeers-server.<account>.workers.dev
          # Set this as a repository variable named SERVER_URL.
          VITE_SERVER_URL: ${{ vars.SERVER_URL }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
